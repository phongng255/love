<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Ngọc Khánh (Da i)</title>

<style>
html, body {
  height: 100%;
  padding: 0;
  margin: 0;
  overflow: hidden;
  background: linear-gradient(-45deg, #1a001f, #330033, #000000, #4d004d);
  background-size: 400% 400%;
  animation: gradientMove 12s ease infinite;
  font-family: 'Segoe UI', cursive;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

canvas {
  position: absolute;
  width: 100%;
  height: 100%;
}

.box {
  width: 100%;
  height: 100%;
  position: relative;
}

/* Title */
.title { 
	position: absolute; 
	top: 47%; 
	left: 50%; 
	transform: translate(-50%, -50%); 
	font-size: 45px; 
	color: #fff; l
	etter-spacing: 4px; 
	animation: glowText 2s ease-in-out infinite alternate, fadeIn 3s ease forwards; 
	opacity: 0; 
	text-align: center; 
}

@keyframes glowText {
  from { text-shadow: 0 0 10px #ff4da6, 0 0 20px #ff4da6; }
  to { text-shadow: 0 0 25px #ff80bf, 0 0 40px #ff1a75; }
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* Stars */
.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  animation: twinkle infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.2; transform: scale(1); }
  to { opacity: 1; transform: scale(1.6); }
}

/* 🌼 Hoa rơi */
.flower {
  position: fixed;
  top: -10px;
  pointer-events: none;
  animation: fall linear forwards;
}

/* 🎀 Hello Kitty rơi */
.kitty {
  position: fixed;
  top: -120px;
  pointer-events: none;
  animation: fallKitty linear forwards;
}

@keyframes fallKitty {
  to {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0.95;
  }
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0.9;
  }
}
</style>
</head>

<body>

<div class="box">
  <canvas id="pinkboard"></canvas>
  <h1 class="title">Ngọc Khánh💖</h1>
</div>

<script>
/* ====== STAR EFFECT ====== */
function createStars() {
  for (let i = 0; i < 60; i++) {
    let star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDuration = 2 + Math.random() * 3 + "s";
    document.body.appendChild(star);
  }
}
createStars();

/* 🌼 Hoa rơi */
function createFlower() {
  const flower = document.createElement("div");
  flower.className = "flower";

  const flowers = ["🌼","💮","✨"];
  flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];

  flower.style.left = Math.random() * 100 + "vw";
  flower.style.animationDuration = 6 + Math.random() * 5 + "s";
  flower.style.fontSize = 18 + Math.random() * 18 + "px";
  flower.style.opacity = 0.8;

  document.body.appendChild(flower);

  setTimeout(() => {
    flower.remove();
  }, 11000);
}
setInterval(createFlower, 500);

/* ====== HEART PARTICLE SYSTEM ====== */

var settings = {
  particles: {
    length: 4000,
    duration: 2.5,
    velocity: 180,
    effect: -0.7,
    size: 15,
  },
};

(function() {
  var c = ["ms", "moz", "webkit", "o"];
  for (var a = 0; a < c.length && !window.requestAnimationFrame; ++a) {
    window.requestAnimationFrame = window[c[a] + "RequestAnimationFrame"];
    window.cancelAnimationFrame =
      window[c[a] + "CancelAnimationFrame"] ||
      window[c[a] + "CancelRequestAnimationFrame"];
  }
})();

function Point(x, y) {
  this.x = x || 0;
  this.y = y || 0;
}
Point.prototype.clone = function() { return new Point(this.x, this.y); };
Point.prototype.length = function(length) {
  if (length === undefined)
    return Math.sqrt(this.x * this.x + this.y * this.y);
  this.normalize();
  this.x *= length;
  this.y *= length;
  return this;
};
Point.prototype.normalize = function() {
  var length = this.length();
  this.x /= length;
  this.y /= length;
  return this;
};

function Particle() {
  this.position = new Point();
  this.velocity = new Point();
  this.acceleration = new Point();
  this.age = 0;
}
Particle.prototype.initialize = function(x, y, dx, dy) {
  this.position.x = x;
  this.position.y = y;
  this.velocity.x = dx;
  this.velocity.y = dy;
  this.acceleration.x = dx * settings.particles.effect;
  this.acceleration.y = dy * settings.particles.effect;
  this.age = 0;
};
Particle.prototype.update = function(deltaTime) {
  this.position.x += this.velocity.x * deltaTime;
  this.position.y += this.velocity.y * deltaTime;
  this.velocity.x += this.acceleration.x * deltaTime;
  this.velocity.y += this.acceleration.y * deltaTime;
  this.age += deltaTime;
};
Particle.prototype.draw = function(context, image) {
  function ease(t) { return (--t) * t * t + 1; }
  var size = image.width * ease(this.age / settings.particles.duration);
  context.globalAlpha = 1 - this.age / settings.particles.duration;
  context.drawImage(image, this.position.x - size/2, this.position.y - size/2, size, size);
};

function ParticlePool(length) {
  this.particles = new Array(length);
  for (var i = 0; i < length; i++)
    this.particles[i] = new Particle();
  this.firstActive = 0;
  this.firstFree = 0;
  this.duration = settings.particles.duration;
}
ParticlePool.prototype.add = function(x,y,dx,dy){
  this.particles[this.firstFree].initialize(x,y,dx,dy);
  this.firstFree = (this.firstFree+1)%this.particles.length;
  if(this.firstActive===this.firstFree)
    this.firstActive = (this.firstActive+1)%this.particles.length;
};
ParticlePool.prototype.update = function(deltaTime){
  if(this.firstActive < this.firstFree){
    for(let i=this.firstActive;i<this.firstFree;i++)
      this.particles[i].update(deltaTime);
  } else {
    for(let i=this.firstActive;i<this.particles.length;i++)
      this.particles[i].update(deltaTime);
    for(let i=0;i<this.firstFree;i++)
      this.particles[i].update(deltaTime);
  }
  while(this.particles[this.firstActive].age >= this.duration && this.firstActive!==this.firstFree){
    this.firstActive = (this.firstActive+1)%this.particles.length;
  }
};
ParticlePool.prototype.draw = function(context,image){
  if(this.firstActive < this.firstFree){
    for(let i=this.firstActive;i<this.firstFree;i++)
      this.particles[i].draw(context,image);
  } else {
    for(let i=this.firstActive;i<this.particles.length;i++)
      this.particles[i].draw(context,image);
    for(let i=0;i<this.firstFree;i++)
      this.particles[i].draw(context,image);
  }
};

(function(canvas){
  var context = canvas.getContext("2d");
  var particles = new ParticlePool(settings.particles.length);
  var particleRate = settings.particles.length/settings.particles.duration;
  var time;

  function pointOnHeart(t){
    return new Point(
      160*Math.pow(Math.sin(t),3),
      130*Math.cos(t)-50*Math.cos(2*t)-20*Math.cos(3*t)-10*Math.cos(4*t)+25
    );
  }

  var image = (function(){
    var canvas = document.createElement("canvas");
    var context = canvas.getContext("2d");
    canvas.width = settings.particles.size;
    canvas.height = settings.particles.size;

    function to(t){
      var point = pointOnHeart(t);
      point.x = settings.particles.size/2 + point.x*settings.particles.size/350;
      point.y = settings.particles.size/2 - point.y*settings.particles.size/350;
      return point;
    }

    context.beginPath();
    var t = -Math.PI;
    var point = to(t);
    context.moveTo(point.x,point.y);
    while(t < Math.PI){
      t += 0.01;
      point = to(t);
      context.lineTo(point.x,point.y);
    }
    context.closePath();

    /* 💛 TIM VÀNG PASTEL */
    context.shadowBlur = 25;
    context.shadowColor = "#ffe699";
    context.fillStyle = "#ffd966";
    context.fill();

    var image = new Image();
    image.src = canvas.toDataURL();
    return image;
  })();

  function render(){
    requestAnimationFrame(render);
    var newTime = new Date().getTime()/1000;
    var deltaTime = newTime - (time || newTime);
    time = newTime;

    context.clearRect(0,0,canvas.width,canvas.height);

    var amount = particleRate*deltaTime;
    for(var i=0;i<amount;i++){
      var pos = pointOnHeart(Math.PI - 2*Math.PI*Math.random());
      var dir = pos.clone().length(settings.particles.velocity);
      particles.add(canvas.width/2 + pos.x, canvas.height/2 - pos.y, dir.x, -dir.y);
    }

    particles.update(deltaTime);
    particles.draw(context,image);
  }

  function onResize(){
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
  window.onresize = onResize;

  setTimeout(function(){
    onResize();
    render();
  },10);

})(document.getElementById("pinkboard"));

/* 🎀 NHIỀU HELLO KITTY RƠI  */

const kittyImages = [
  "https://pngimg.com/uploads/hello_kitty/hello_kitty_PNG47.png"
];

function createKitty() {
  const kitty = document.createElement("img");
  kitty.className = "kitty";

  // chọn ngẫu nhiên 1 hình
  kitty.src = kittyImages[Math.floor(Math.random() * kittyImages.length)];

  kitty.style.left = Math.random() * 100 + "vw";
  kitty.style.animationDuration = 6 + Math.random() * 6 + "s";
  kitty.style.width = 40 + Math.random() * 40 + "px";

  document.body.appendChild(kitty);

  setTimeout(() => {
    kitty.remove();
  }, 12000);
}

// tăng mật độ rơi
setInterval(createKitty, 600);

</script>

</body>
</html>
